# AIS data pipeline — local stack
#
#   docker compose up -d                   Postgres + pipeline (sample data) + API
#   docker compose --profile full up -d    + Streamlit dashboard + Airflow
#
# Load real data:  PIPELINE_ARGS="--noaa-date 2023-01-01 --max-records 200000" docker compose up -d

x-db-env: &db-env
  DB_HOST: postgres
  DB_PORT: 5432
  DB_NAME: ${DB_NAME:-tanger_med}
  DB_USER: ${DB_USER:-postgres}
  DB_PASSWORD: ${DB_PASSWORD:-password}

x-airflow-common: &airflow-common
  image: apache/airflow:2.9.3-python3.11
  environment: &airflow-env
    <<: *db-env
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${DB_USER:-postgres}:${DB_PASSWORD:-password}@postgres:5432/airflow_db
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "true"
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__WEBSERVER__SECRET_KEY: ${AIRFLOW_SECRET_KEY:-local-dev-only}
    PYTHONPATH: /opt/airflow
    AIS_DATA_DIR: /opt/airflow/data
  volumes:
    - ./airflow/dags:/opt/airflow/dags
    - ./src:/opt/airflow/src
    - ./sample_data:/opt/airflow/sample_data
    - airflow_logs:/opt/airflow/logs
    # Downloads/intermediate files go to /opt/airflow/data inside the container (owned by the
    # airflow user). Not mounting a root-owned volume there avoids permission errors.
  depends_on:
    postgres:
      condition: service_healthy

services:
  postgres:
    image: postgres:15
    environment:
      POSTGRES_DB: ${DB_NAME:-tanger_med}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-password}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./sql/init_airflow_db.sql:/docker-entrypoint-initdb.d/00_airflow_db.sql:ro
      - ./src/storage/schema.sql:/docker-entrypoint-initdb.d/10_schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  # One-shot job: runs the pipeline once, then exits.
  data-init:
    build: .
    environment:
      <<: *db-env
      PIPELINE_ARGS: ${PIPELINE_ARGS:---local-file sample_data/sample_ais.csv}
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ais_data:/app/data
    command: ["/bin/bash", "/entrypoint.sh"]
    restart: "no"

  app:
    build: .
    ports:
      - "8000:8000"
    environment: *db-env
    depends_on:
      postgres:
        condition: service_healthy
    command: uvicorn src.api.main:app --host 0.0.0.0 --port 8000
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:8000/health | grep -q healthy"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  dashboard:
    build: .
    ports:
      - "8501:8501"
    environment:
      API_URL: http://app:8000
    depends_on:
      app:
        condition: service_healthy
    command: streamlit run dashboard/app.py --server.address 0.0.0.0 --server.port 8501
    restart: unless-stopped
    profiles: [full]

  airflow-init:
    <<: *airflow-common
    command: >
      bash -c "airflow db migrate &&
               airflow users create --username admin --password admin --firstname Admin
               --lastname User --role Admin --email admin@example.com || true"
    restart: "no"
    profiles: [full]

  airflow-webserver:
    <<: *airflow-common
    command: airflow webserver
    ports:
      - "8080:8080"
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    restart: unless-stopped
    profiles: [full]

  airflow-scheduler:
    <<: *airflow-common
    command: airflow scheduler
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    restart: unless-stopped
    profiles: [full]

volumes:
  postgres_data:
  ais_data:
  airflow_logs:
